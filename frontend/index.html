
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            display: none;
        }

        #answer {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #latency {
            color: #64748b;
            font-size: 13px;
            margin-top: 10px;
        }

        #status {
            text-align: center;
            margin-top: 10px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Gemini AI Assistant</h1>

        <textarea id="question"
            placeholder="Ask your question here..."></textarea>

        <button id="askBtn" onclick="askQuestion()">
            Ask Gemini
        </button>

        <p id="status"></p>

        <div class="result" id="result">
            <h3>Answer:</h3>
            <div id="answer"></div>
            <p id="latency"></p>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value.trim();
            const button = document.getElementById("askBtn");
            const status = document.getElementById("status");
            const result = document.getElementById("result");

            if (!question) {
                alert("Please enter a question!");
                return;
            }

            button.disabled = true;
            button.innerText = "Thinking...";
            status.innerText = "Generating response...";
            result.style.display = "none";

            try {
                const response = await fetch("http://127.0.0.1:8000/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const data = await response.json();

                document.getElementById("answer").textContent = data.answer;
                document.getElementById("latency").innerText =
                    "Response time: " + data.latency + " seconds";

                result.style.display = "block";
                status.innerText = "";

            } catch (error) {
                status.innerText = "Error: " + error.message;
            }

            button.disabled = false;
            button.innerText = "Ask Gemini";
        }
    </script>

</body>
</html>
